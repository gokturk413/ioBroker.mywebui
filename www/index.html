  <script>
    let storedParentUrl;
    window.esmsInitOptions = {
      shimMode: true,
      mapOverrides: true,
      resolve: (id, parentUrl, resolve) => {
        if (!storedParentUrl)
          storedParentUrl = parentUrl;
        if (parentUrl.startsWith('blob:'))
          parentUrl = storedParentUrl;
        return resolve(id, parentUrl)
      }
    }
  </script>

  <script type="module">
    // per-project widgets: resolve the active project (mirror of IobrokerHandler logic)
    const _webuiProject = (() => {
      try {
        const u = new URLSearchParams(location.search).get('project');
        let n = u || (location.pathname.endsWith('runtime.html') ? 'default' : (localStorage.getItem('webui-current-project') || 'default'));
        n = (n || '').toString().trim().toLowerCase().replaceAll(' ', '-');
        return /^[a-z0-9_-]+$/.test(n) ? n : 'default';
      } catch (e) { return 'default'; }
    })();
    const _widgetsBase = 'mywebui.0.projects/' + _webuiProject + '/widgets/';
    try {
      await new Promise((resolve) => {
        const scp = document.createElement('script');
        scp.src = iobrokerWebRootUrl + _widgetsBase + 'importmap.js';
        scp.onload = resolve;
        scp.onerror = resolve; // file may not exist (no widgets installed)
        document.head.appendChild(scp);
      });
      await importShim(iobrokerWebRootUrl + _widgetsBase + 'importWidgetFiles.js');
    } catch (err) {
      console.warn(err);
    }
    importShim('./dist/frontend/config/IobrokerWebuiAppShell.js');
  </script>

  <style>
    body {
      margin: 0;
      font-family: 'Roboto', 'Noto', sans-serif;
      line-height: 1.5;

      -webkit-font-smoothing: antialiased;
      overflow: hidden;

    .lds-facebook {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 80px;
      position: absolute;
      left: calc(50% - 40px);
      top: calc(50% - 40px);
    }

    .lds-facebook div {
      animation-duration: 1s !important;
      animation-iteration-count: infinite !important;
      display: inline-block;
      position: absolute;
      left: 8px;
      width: 16px;
      background: black;
      animation: lds-facebook 1.2s cubic-bezier(0, 0.5, 0.5, 1) infinite;
    }

    .lds-facebook div:nth-child(1) {
      left: 8px;
      animation-delay: -0.24s;
    }

    .lds-facebook div:nth-child(2) {
      left: 32px;
      animation-delay: -0.12s;
    }

    .lds-facebook div:nth-child(3) {
      left: 56px;
      animation-delay: 0;
    }

    @keyframes lds-facebook {
      0% {
        top: 8px;
        height: 64px;
      }

      50%,
      100% {
        top: 24px;
        height: 32px;
      }
    }

    html {

    #shell {

    }

    .blocklyDropDownDiv {
      z-index: 99999;
    }
  </style>

    /* https://codepen.io/sosuke/pen/Pjoqqp - css filter generator */

    <div id="themeSwitch" style="margin-left:auto; display:flex; align-items:center; gap:8px; padding-right:10px;">
      <span style="opacity:.7;">Theme:</span>
      <select id="themeSel" style="background:transparent; color:inherit; border:1px solid #667; border-radius:4px; padding:1px 5px; font-size:12px;"></select>
      <span id="accentDots" style="display:flex; gap:4px;"></span>
    </div>

  <script>
    (function () {
      function initThemeSwitch() {
        var shell = document.getElementById('shell');
        if (!shell || !shell.getTheme) { setTimeout(initThemeSwitch, 200); return; }
        var t = shell.getTheme();
        var sel = document.getElementById('themeSel');
        var dots = document.getElementById('accentDots');
        sel.innerHTML = '';
        t.themes.forEach(function (n) {
          var o = document.createElement('option'); o.value = n; o.textContent = n.charAt(0).toUpperCase() + n.slice(1);
          if (n === t.name) o.selected = true; sel.appendChild(o);
        });
        sel.onchange = function () { shell.setTheme(sel.value); };
        var hexes = { blue:'#2680eb', magenta:'#e91e63', green:'#16b364', orange:'#e08020', purple:'#9256d9', cyan:'#19b6c9' };
        dots.innerHTML = '';
        t.accents.forEach(function (a) {
          var b = document.createElement('button');
          b.title = a; b.dataset.acc = a;
          b.style.cssText = 'width:14px;height:14px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;background:' + (hexes[a] || '#888');
          b.onclick = function () { shell.setAccent(a); mark(); };
          dots.appendChild(b);
        });
        function mark() { var cur = shell.getTheme().accent; dots.querySelectorAll('button').forEach(function (b) { b.style.borderColor = b.dataset.acc === cur ? '#fff' : 'transparent'; }); }
        mark();
      }
      initThemeSwitch();
    })();
  </script>
